[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdf-crawler"
version = "0.1.0"
description = "Daily crawler for Korean Target Date Fund (TDF) disclosure data from KOFIA into SQLite"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
# Selenium-based fetcher (fallback / live capture) is optional.
selenium = ["selenium>=4.18"]
# HTML parsing helpers (only needed if a source returns HTML instead of XML).
html = ["beautifulsoup4>=4.12", "lxml>=5.0"]
dev = ["pytest>=8.0", "freezegun>=1.4"]

[project.scripts]
tdf-crawl = "tdf_crawler.run:main"

[tool.setuptools.packages.find]
include = ["tdf_crawler*"]

[tool.pytest.ini_options]
markers = [
    "live: hits the real KOFIA network (deselected by default; run with -m live)",
]
addopts = "-m 'not live'"
testpaths = ["tests"]
